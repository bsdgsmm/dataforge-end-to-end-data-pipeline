name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  AIRFLOW_VERSION: "3.3.2"

jobs:
  lint-and-unit:
    name: Lint, unit tests, dbt parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        run: pip install --constraint constraints.txt -e ".[dbt,dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: SQLFluff lint (dbt models and analysis SQL)
        run: sqlfluff lint dbt/marketplace_analytics sql
      - name: Unit tests
        run: pytest
      - name: dbt parse
        env:
          DATAFORGE_DB_USER: parse_only
          DATAFORGE_DB_PASSWORD: parse_only
        run: dbt parse --project-dir dbt/marketplace_analytics --profiles-dir dbt/marketplace_analytics

  integration:
    name: Integration tests and end-to-end pipeline
    runs-on: ubuntu-latest
    needs: lint-and-unit
    services:
      postgres:
        image: postgres:16-alpine
        # Credentials for a throwaway service container that exists only for this job.
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: marketplace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d marketplace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATAFORGE_DB_HOST: localhost
      DATAFORGE_DB_PORT: "5432"
      DATAFORGE_DB_NAME: marketplace
      DATAFORGE_DB_USER: ci_user
      DATAFORGE_DB_PASSWORD: ci_only_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        run: pip install --constraint constraints.txt -e ".[dbt,dev]"
      - name: Integration tests
        run: pytest -m integration
      - name: Generate sample data
        run: dataforge generate-data
      - name: Run the full pipeline
        run: dataforge run-pipeline --run-id ci__${{ github.run_id }}
      - name: Rerun the same batch (idempotency)
        run: dataforge run-pipeline --run-id ci__${{ github.run_id }}
      - name: Upload data quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-quality-report
          path: data/reports/
          if-no-files-found: ignore

  dag:
    name: Airflow DAG tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install Airflow with official constraints
        run: |
          pip install "apache-airflow==${AIRFLOW_VERSION}" pandas pytest \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-3.12.txt"
          pip install --no-deps -e .
      - name: DAG tests
        run: pytest tests/dags -m airflow

  docker:
    name: Docker image and Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose file
        run: docker compose --env-file .env.example --profile airflow config --quiet
      - name: Build Airflow image
        run: docker build --tag dataforge-airflow:ci .
      - name: Smoke test the pipeline CLI inside the image
        run: |
          docker run --rm --entrypoint /opt/dataforge-venv/bin/dataforge dataforge-airflow:ci --help
          docker run --rm --entrypoint /opt/dataforge-venv/bin/dbt dataforge-airflow:ci --version
